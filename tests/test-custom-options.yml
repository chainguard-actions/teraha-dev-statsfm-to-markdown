name: Test custom options - dark theme, image mode, lifetime range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README with markers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests"
          printf '# My Music Stats\n\n<!-- STATSFM START -->\n<!-- STATSFM END -->\n' \
            > "$GITHUB_WORKSPACE/tests/test-readme-custom.md"
          echo "=== Created README ==="
          cat "$GITHUB_WORKSPACE/tests/test-readme-custom.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: "teraha"
          display_limit: "2"
          items_per_row: "2"
          show_duration: "false"
          show_rank: "false"
          time_range: "lifetime"
          readme_path: "tests/test-readme-custom.md"
          theme: "dark"
          display_mode: "image"

      - name: Assert README markers are intact and content may be present
        run: |
          README="$GITHUB_WORKSPACE/tests/test-readme-custom.md"
          echo "=== README content ==="
          cat "$README"
          echo "=== End README ==="

          # Check that the markers still exist
          if ! grep -q "<!-- STATSFM START -->" "$README"; then
            echo "FAIL: START marker missing from README"
            exit 1
          fi
          if ! grep -q "<!-- STATSFM END -->" "$README"; then
            echo "FAIL: END marker missing from README"
            exit 1
          fi

          echo "PASS: README markers are intact"

          # Check if content was inserted between markers
          BETWEEN=$(awk '/<!-- STATSFM START -->/,/<!-- STATSFM END -->/' "$README")
          echo "Content between markers: $BETWEEN"

          if echo "$BETWEEN" | grep -q '<img\|<a href\|No recent albums\|No displayable'; then
            echo "PASS: README was updated with album content or no-data message"
          else
            echo "INFO: No album content found - API may be unavailable (acceptable)"
          fi
