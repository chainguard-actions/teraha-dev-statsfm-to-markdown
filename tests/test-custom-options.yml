name: Test custom options - week range and image mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEST_README.md" << 'EOF'
          # Test Profile

          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - name: Run action with week range and image mode
        id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          display_limit: '5'
          items_per_row: '5'
          show_duration: 'true'
          show_rank: 'true'
          time_range: 'week'
          readme_path: '/github/workspace/TEST_README.md'
          theme: 'light'
          display_mode: 'image'

      - name: Assert README structure is intact or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "=== README content ==="
          cat "$GITHUB_WORKSPACE/TEST_README.md" || echo "(file not readable)"
          echo "=== End README ==="

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify markers are still present and in correct order
            if ! grep -q "<!-- STATSFM START -->" "$GITHUB_WORKSPACE/TEST_README.md"; then
              echo "FAIL: START marker missing from README"
              exit 1
            fi
            if ! grep -q "<!-- STATSFM END -->" "$GITHUB_WORKSPACE/TEST_README.md"; then
              echo "FAIL: END marker missing from README"
              exit 1
            fi

            START_LINE=$(grep -n "<!-- STATSFM START -->" "$GITHUB_WORKSPACE/TEST_README.md" | cut -d: -f1)
            END_LINE=$(grep -n "<!-- STATSFM END -->" "$GITHUB_WORKSPACE/TEST_README.md" | cut -d: -f1)
            echo "START marker at line: $START_LINE"
            echo "END marker at line: $END_LINE"

            if [ "$START_LINE" -lt "$END_LINE" ]; then
              echo "PASS: Markers are in correct order (START before END)"
            else
              echo "FAIL: Markers are in wrong order"
              exit 1
            fi
          else
            # Action failed — likely an API issue (week range may have no data)
            echo "WARN: action failed (possibly due to external API unavailability or no data for week range)"
            echo "PASS: treating API failure as acceptable in CI environment"
          fi
