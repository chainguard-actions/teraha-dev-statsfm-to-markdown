name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README with markers
        run: |
          cat > "$GITHUB_WORKSPACE/test-readme-custom.md" << 'EOF'
          # Test README Custom
          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          display_limit: '3'
          items_per_row: '3'
          show_duration: 'false'
          show_rank: 'false'
          time_range: 'lifetime'
          readme_path: 'test-readme-custom.md'
          theme: 'dark'
          display_mode: 'svg'

      - name: Assert README markers are present (action ran)
        run: |
          echo "=== action outcome: ${{ steps.action.outcome }} ==="
          echo "=== README content ==="
          cat "$GITHUB_WORKSPACE/test-readme-custom.md"
          if ! grep -q "STATSFM START" "$GITHUB_WORKSPACE/test-readme-custom.md"; then
            echo "FAIL: STATSFM START marker missing from README"
            exit 1
          fi
          if ! grep -q "STATSFM END" "$GITHUB_WORKSPACE/test-readme-custom.md"; then
            echo "FAIL: STATSFM END marker missing from README"
            exit 1
          fi
          echo "PASS: README was updated successfully with custom options"
