name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README with markers
        run: |
          cat > /tmp/test-readme-custom.md << 'EOF'
          # Test Profile

          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          display_limit: '3'
          items_per_row: '3'
          show_duration: 'false'
          show_rank: 'false'
          time_range: 'months'
          readme_path: '/tmp/test-readme-custom.md'
          theme: 'dark'

      - name: Assert action ran with custom options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (not be skipped). It may fail due to API
          # unavailability in the test environment, which is acceptable.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom options (outcome=${{ steps.action.outcome }})"
