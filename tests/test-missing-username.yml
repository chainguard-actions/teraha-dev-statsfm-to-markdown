name: Test missing username fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEST_README.md" << 'EOF'
          # Test Profile

          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - name: Run action without username (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: ''
          readme_path: '/github/workspace/TEST_README.md'

      - name: Assert action failed due to missing username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when username is missing"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
