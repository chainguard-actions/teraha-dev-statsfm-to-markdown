name: Test missing username fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README with markers
        run: |
          cat > "$GITHUB_WORKSPACE/test-no-user-readme.md" << 'EOF'
          # My Profile

          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - name: Run action without username (expect failure)
        id: action
        uses: .
        with:
          statsfm_username: ''
          readme_path: '/github/workspace/test-no-user-readme.md'
        continue-on-error: true

      - name: Assert action failed due to missing username
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail when username is empty, but it succeeded"
            exit 1
          fi
          echo "PASS: Action correctly failed when username was not provided"
