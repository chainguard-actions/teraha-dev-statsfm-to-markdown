name: Test missing username - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README with markers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests"
          printf '# My Music Stats\n\n<!-- STATSFM START -->\n<!-- STATSFM END -->\n' \
            > "$GITHUB_WORKSPACE/tests/test-readme-no-user.md"
          echo "=== Created README ==="
          cat "$GITHUB_WORKSPACE/tests/test-readme-no-user.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: ""
          readme_path: "tests/test-readme-no-user.md"

      - name: Assert action failed due to missing username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when username is empty, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when username was not provided"
