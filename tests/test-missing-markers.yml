name: Test missing README markers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare test README from fixture
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/test-readme-no-markers.md" \
             "$GITHUB_WORKSPACE/tests/fixtures/test-readme-no-markers-run.md"
          echo "Prepared README:"
          cat "$GITHUB_WORKSPACE/tests/fixtures/test-readme-no-markers-run.md"

      - id: action
        uses: .
        with:
          statsfm_username: teraha
          readme_path: /github/workspace/tests/fixtures/test-readme-no-markers-run.md
        continue-on-error: true

      - name: Assert action failed (missing markers or API unavailable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should fail either because:
          # 1. The API returned data but the README has no STATSFM markers (expected failure)
          # 2. The API itself failed (also a failure)
          # In both cases, the action should NOT succeed.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: Expected action to fail when README has no STATSFM markers, but outcome was 'success'"
            exit 1
          fi
          echo "PASS: Action correctly failed (missing markers or API unavailable)"
