name: Test missing README markers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README without markers
        run: |
          printf '# My Profile\n\n## Top Albums\n\nNo markers here.\n' > "$GITHUB_WORKSPACE/test-readme-no-markers.md"
          echo "=== Created README ==="
          cat "$GITHUB_WORKSPACE/test-readme-no-markers.md"

      - name: Run action expecting failure
        id: action
        uses: .
        with:
          statsfm_username: teraha
          display_limit: '5'
          time_range: 'lifetime'
          readme_path: /github/workspace/test-readme-no-markers.md
          display_mode: 'image'
        continue-on-error: true

      - name: Assert action did not succeed
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $ACTION_OUTCOME"
          if [ "$ACTION_OUTCOME" = "success" ]; then
            echo "FAIL: Expected action to fail (missing markers), but it succeeded"
            exit 1
          fi
          echo "PASS: Action did not succeed (failed due to missing markers or API unavailable)"
