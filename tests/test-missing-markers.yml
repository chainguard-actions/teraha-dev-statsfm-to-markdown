name: Test missing README markers fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README without markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEST_README.md" << 'EOF'
          # Test Profile

          This README has no statsfm markers.
          EOF

      - name: Run action with README missing markers (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          readme_path: '/github/workspace/TEST_README.md'

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (either missing markers or API error)"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
