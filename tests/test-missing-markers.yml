name: Test README missing markers fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README without markers in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/test-readme-no-markers.md" << 'EOF'
          # My Profile

          This README has no statsfm markers.
          EOF
          echo "Created README at: $GITHUB_WORKSPACE/test-readme-no-markers.md"
          cat "$GITHUB_WORKSPACE/test-readme-no-markers.md"

      - name: Run action with README that has no markers (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          readme_path: /github/workspace/test-readme-no-markers.md

      - name: Assert action failed due to missing markers
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when README has no markers, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed when README markers were missing"
