name: Test missing markers fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README without markers
        run: |
          cat > "$GITHUB_WORKSPACE/test-readme-nomarkers.md" << 'EOF'
          # Test README Without Markers
          This README has no STATSFM markers.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          readme_path: 'test-readme-nomarkers.md'

      - name: Assert action failed due to missing markers
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when README has no STATSFM markers, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when markers were missing"
