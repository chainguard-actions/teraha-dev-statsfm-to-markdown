name: Test missing README markers fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README without markers
        run: |
          cat > "$GITHUB_WORKSPACE/test-no-markers-readme.md" << 'EOF'
          # My Profile

          This README has no statsfm markers.
          EOF

      - name: Run action with README missing markers (expect failure)
        id: action
        uses: .
        with:
          statsfm_username: teraha
          readme_path: '/github/workspace/test-no-markers-readme.md'
        continue-on-error: true

      - name: Assert action failed due to missing markers
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: Expected action to fail when README markers are missing, but it succeeded"
            exit 1
          fi
          echo "PASS: Action correctly failed when README markers were not present"
