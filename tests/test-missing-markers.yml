name: Test missing README markers - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test README WITHOUT markers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests"
          printf '# My Music Stats\n\nThis README has no statsfm markers at all.\n' \
            > "$GITHUB_WORKSPACE/tests/test-readme-no-markers.md"
          echo "=== Created README ==="
          cat "$GITHUB_WORKSPACE/tests/test-readme-no-markers.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: "teraha"
          readme_path: "tests/test-readme-no-markers.md"

      - name: Assert action failed due to missing markers
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when README has no markers, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when README markers were missing"
