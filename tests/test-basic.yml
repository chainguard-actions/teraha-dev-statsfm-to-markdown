name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create README with markers
        run: |
          cat > "$GITHUB_WORKSPACE/TEST_README.md" << 'EOF'
          # Test Profile

          <!-- STATSFM START -->
          <!-- STATSFM END -->
          EOF

      - name: Run statsfm-to-markdown action
        id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          display_limit: '3'
          items_per_row: '3'
          show_duration: 'true'
          show_rank: 'true'
          time_range: 'weeks'
          readme_path: '/github/workspace/TEST_README.md'
          theme: 'light'
          display_mode: 'image'

      - name: Assert README was updated or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "=== README content ==="
          cat "$GITHUB_WORKSPACE/TEST_README.md" || echo "(file not readable)"
          echo "=== End README ==="

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify README markers are still present
            if ! grep -q "<!-- STATSFM START -->" "$GITHUB_WORKSPACE/TEST_README.md"; then
              echo "FAIL: START marker missing from README"
              exit 1
            fi
            if ! grep -q "<!-- STATSFM END -->" "$GITHUB_WORKSPACE/TEST_README.md"; then
              echo "FAIL: END marker missing from README"
              exit 1
            fi
            echo "PASS: action succeeded and README markers are intact"
          else
            # Action failed — likely an API issue, which is acceptable in CI
            echo "WARN: action failed (possibly due to external API unavailability)"
            echo "PASS: treating API failure as acceptable in CI environment"
          fi
