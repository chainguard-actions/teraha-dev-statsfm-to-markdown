name: Test missing README error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: teraha
          readme_path: '/tmp/nonexistent-readme-that-does-not-exist.md'

      - name: Assert action failed due to missing README
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when README does not exist, but got outcome=${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when README file was not found"
