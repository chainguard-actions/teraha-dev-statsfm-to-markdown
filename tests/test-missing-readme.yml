name: Test missing README file - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure the test README does not exist
        run: |
          rm -f "$GITHUB_WORKSPACE/tests/this-file-does-not-exist.md"
          echo "Confirmed: tests/this-file-does-not-exist.md does not exist"

      - id: action
        uses: .
        continue-on-error: true
        with:
          statsfm_username: "teraha"
          readme_path: "tests/this-file-does-not-exist.md"

      - name: Assert action failed due to missing README file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when README file does not exist, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when README file was not found"
